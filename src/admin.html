<!doctype html>
<html lang="uz">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin panel — Ulug‘ saltanat lug‘ati</title><link rel="stylesheet" href="admin.css"></head>
<body>
  <section id="login" class="login-shell"><form id="loginForm" class="login-card"><span class="eyebrow">HIMOYALANGAN SAHIFA</span><h1>Admin paneli</h1><p>Lug‘atni boshqarish uchun parolni kiriting.</p><label>Admin paroli<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Kirish</button><p id="loginError" class="error" aria-live="polite"></p><a href="/">← Lug‘atga qaytish</a></form></section>
  <main id="panel" hidden>
    <header><div><span class="eyebrow">ULUG‘ SALTANAT LUG‘ATI</span><h1>Boshqaruv paneli</h1></div><div class="header-actions"><a class="button secondary" href="/">Saytni ko‘rish</a><button id="logout" class="secondary">Chiqish</button></div></header>
    <section class="summary"><div><strong id="total">0</strong><span>Jami birlik</span></div><div><strong id="hist">0</strong><span>Istorizm</span></div><div><strong id="arch">0</strong><span>Arxaizm</span></div></section>
    <section class="toolbar"><input id="search" type="search" placeholder="So‘z yoki ma’no bo‘yicha qidiring"><button id="add">＋ Yangi so‘z qo‘shish</button></section>
    <p id="notice" class="notice" aria-live="polite"></p>
    <section class="list"><table><thead><tr><th>№</th><th>Bosh so‘z</th><th>Turi</th><th>Makromaydon</th><th>Hozirgi ma’nosi</th><th>Sahifa</th><th>Amallar</th></tr></thead><tbody id="rows"></tbody></table><div id="cards" class="cards"></div></section>
  </main>
  <dialog id="editor"><form id="wordForm"><div class="dialog-head"><div><span class="eyebrow">LUG‘AT BIRLIGI</span><h2 id="formTitle">Yangi so‘z</h2></div><button id="closeEditor" type="button" class="icon">×</button></div><input id="wordId" type="hidden"><div class="form-grid"><label>Bosh so‘z<input id="headword" required></label><label>Turi<select id="type"><option>Istorizm</option><option>Arxaizm</option></select></label><label>Makromaydon<input id="lexicalField" required></label><label>Mikromaydon<input id="microfield" required></label><label class="wide">Hozirgi ma’nosi<textarea id="modernMeaning" required></textarea></label><label class="wide">Asardagi kontekst<textarea id="context"></textarea></label><label>Kitob qismi<input id="book" type="number" min="1" value="1" required></label><label>Birinchi sahifa<input id="firstPage" type="number" min="1" value="1" required></label><label class="wide">Uchrash sahifalari<input id="pages" required></label><label class="wide">Tasniflash asosi<textarea id="classificationBasis"></textarea></label><label>Ishonchlilik<select id="confidence"><option>Yuqori</option><option>O‘rta</option><option>Past</option></select></label><label class="wide">Izoh<textarea id="note"></textarea></label></div><p id="formError" class="error"></p><div class="dialog-actions"><button id="cancel" type="button" class="secondary">Bekor qilish</button><button id="save" type="submit">Saqlash</button></div></form></dialog>
  <dialog id="confirm"><div class="confirm-card"><h2>So‘z o‘chirilsinmi?</h2><p id="confirmText"></p><div class="dialog-actions"><button id="cancelDelete" class="secondary">Bekor qilish</button><button id="delete" class="danger">O‘chirish</button></div></div></dialog>
  <script src="admin.js" defer></script>
</body></html>
